name: QeiwtPet
version: 1.0.0
main: com.qeiwt.qeiwtpet.QeiwtPet
api-version: '1.21'
author: qeiwt
description: Complete EcoPets features rebranded as QeiwtPet
commands:
  qeiwtpet:
    description: Main command for QeiwtPet
    aliases: [qpet, pet, pets]
    permission: qeiwtpet.use
permissions:
  qeiwtpet.use:
    description: Allows player to use pet commands
    default: true
  qeiwtpet.admin:
    description: Allows administrative actions
    default: op
